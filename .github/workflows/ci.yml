name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      - run: dotnet restore ClinicAssessment.sln
      - run: dotnet build ClinicAssessment.sln --no-restore
      - run: dotnet test ClinicAssessment.sln --no-build
      - run: dotnet format ClinicAssessment.sln --verify-no-changes --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClinicApp.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ClinicApp.Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
